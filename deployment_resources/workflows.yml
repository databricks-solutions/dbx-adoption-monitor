resources:
  jobs:
    adoption_dash_job:
      name: adoption_dashboard_workflow
      tasks:
        - task_key: Ingest_Metadata
          environment_key: default
          notebook_task:
            notebook_path: ../src/01_get_metadata.ipynb
        - task_key: Process_MatVews
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactDashboardUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_Genie
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactGenieUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_Genie_Token_Usage
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactGenieTokenUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_ServingUsage
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactServingUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_VectorSearchCost
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactVectorSearchCost.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_Apps
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactAppUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_dbsql_cost_per_query
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_dbsql_cost_per_query.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_genie_cost_per_message
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Process_dbsql_cost_per_query
          sql_task:
            file:
              path: ../src/02_genie_cost_per_message.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_genie_cost_categorised
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Process_dbsql_cost_per_query
          sql_task:
            file:
              path: ../src/02_genie_cost_categorised.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Set_Deployment_Context
          depends_on:
            - task_key: Ingest_Metadata
          environment_key: default
          notebook_task:
            notebook_path: ../src/03_set_deployment_context.py
        - task_key: Publish_Conformed_Dimensions
          depends_on:
            - task_key: Set_Deployment_Context
            - task_key: Process_MatVews
            - task_key: Process_Genie
            - task_key: Process_Genie_Token_Usage
            - task_key: Process_ServingUsage
            - task_key: Process_VectorSearchCost
            - task_key: Process_Apps
            - task_key: Process_dbsql_cost_per_query
          sql_task:
            file:
              path: ../src/04_conformed_dimensions.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Publish_Conformed_Event_Facts
          depends_on:
            - task_key: Publish_Conformed_Dimensions
          sql_task:
            file:
              path: ../src/05_conformed_event_facts.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Publish_Conformed_Cost_Facts
          depends_on:
            - task_key: Publish_Conformed_Event_Facts
            - task_key: Process_genie_cost_per_message
            - task_key: Process_genie_cost_categorised
          sql_task:
            file:
              path: ../src/06_conformed_cost_facts.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Publish_Genie_Space_Daily_Summary
          depends_on:
            - task_key: Publish_Conformed_Cost_Facts
          sql_task:
            file:
              path: ../src/07_genie_space_daily_summary.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Verify_Conformed_Model
          depends_on:
            - task_key: Publish_Genie_Space_Daily_Summary
          sql_task:
            file:
              path: ../src/08_verify_conformed_model.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Deploy_Metric_Views
          depends_on:
            - task_key: Verify_Conformed_Model
          environment_key: default
          notebook_task:
            notebook_path: ../src/09_deploy_metric_views.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              my_warehouse_id: ${var.my_warehouse_id}
        - task_key: Verify_Metric_Views
          depends_on:
            - task_key: Deploy_Metric_Views
          sql_task:
            file:
              path: ../src/10_verify_metric_views.sql
            warehouse_id: ${var.my_warehouse_id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: skip_get_conversations
          default: ${var.skip_get_conversations}
        - name: enable_genie_feedback_comments
          default: ${var.enable_genie_feedback_comments}
        - name: lookback_days
          default: ${var.lookback_days}
        - name: my_warehouse_id
          default: ${var.my_warehouse_id}
      environments:
        # Serverless environment for the Ingest_Metadata notebook task. Provides the
        # Databricks SDK as a managed dependency instead of an in-notebook %pip install
        # (immutable-constraint serverless compute rejects `%pip install ... --upgrade`).
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.129.0
      performance_target: PERFORMANCE_OPTIMIZED
